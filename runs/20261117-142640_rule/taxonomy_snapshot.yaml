# 위험요인 분류 체계 (교육용, 가상)
# - 이 분류는 위험요인 분류의 일관성을 확인하기 위한 교육용 기준이며 법적 적합성 판정 기준이 아닙니다.
# - rules: 규칙 기반 기준선이 쓰는 정규식 묶음. 묶음 안의 정규식이 한 문장(또는 절)에 모두 나타나면 해당 코드로 판정합니다.
# - actions: 개선조치 "후보"(검토용). 확정 지시가 아닙니다.

version: taxonomy_v1

categories:
  - 전기
  - 넘어짐
  - 화학물질
  - 기계
  - 환기
  - 가스
  - 화재
  - 추락
  - 보호구
  - 정상
  - 확인필요

codes:
  ELEC_PANEL_BLOCKED:
    name: 배전반·분전반 전면 적치(접근 방해)
    category: 전기
    rules:
      - ["(배전반|분전반|제어반)", "(앞|접근)", "(쌓|놓|적치|세워|막|뭐가|있)"]
    actions:
      - 배전반 전면 적치물 이동 및 전면 작업공간 확보
      - 배전반 전면 적치 금지 구역 표시 검토
  ELEC_CABLE_DAMAGED:
    name: 전선·케이블 피복 손상
    category: 전기
    rules:
      - ["(전선|케이블|코드)", "(피복|절연)", "(벗겨|찢어|갈라|손상|떨어)"]
      - ["(전선|케이블)", "(찢어|갈라|손상|벗겨|눌렸)"]
    actions:
      - 해당 전원 차단 후 손상 케이블 교체 검토
      - 케이블 보호관·덮개 설치 검토
  ELEC_PANEL_OPEN:
    name: 배전반·제어반 문 개방 또는 충전부 노출
    category: 전기
    rules:
      - ["(배전반|분전반|제어반)", "(문|커버)", "(열린|열려|떼어|개방)"]
      - ["(충전부|단자)", "(노출|보입|보이)"]
    actions:
      - 출입 통제 후 전기 담당자 확인 요청
      - 배전반 문 잠금 및 커버 재설치 검토
  ELEC_OVERLOAD:
    name: 멀티탭 연속 연결·과부하 의심
    category: 전기
    rules:
      - ["멀티탭", "(또 멀티탭|꽂|문어발|한꺼번에|여러)"]
    actions:
      - 멀티탭 연속 연결 해소 및 전용 콘센트 사용 검토
      - 고용량 전열기기 사용 현황 확인
  TRIP_WALKWAY_OBSTRUCTED:
    name: 통로 자재·물건 방치
    category: 넘어짐
    rules:
      - ["통로", "(자재|박스|파렛트|팔레트|상자|호스|쌓|방치|나와|내려|놓)"]
    actions:
      - 통로 적치물 정리 및 보행통로 확보
      - 통로 구획선·적치 구역 지정 검토
  SLIP_FLOOR_WET:
    name: 바닥 기름·물 등으로 인한 미끄럼
    category: 넘어짐
    rules:
      - ["(바닥|입구)", "(절삭유|기름|물이|물 |윤활유|유압유|젖어|고여|흥건|번져|미끄)"]
    actions:
      - 바닥 오염물 제거 및 미끄럼 주의 표시
      - 누유·누수 발생원 확인 검토
  TRIP_FLOOR_DAMAGED:
    name: 바닥 파손·단차
    category: 넘어짐
    rules:
      - ["(바닥|덮개|철판|보행로|에폭시)", "(깨져|파인|들려|들떠|단차|턱|파손)"]
    actions:
      - 파손 부위 표시 및 임시 보수
      - 바닥 보수 일정 검토
  CHEM_LABEL_MISSING:
    name: 화학물질 용기 식별표시 누락
    category: 화학물질
    rules:
      - ["(용기|말통|통|시약병|병)", "(표시|라벨|이름표)", "(없|누락|떨어)"]
    actions:
      - 내용물 확인 후 경고표지·식별표시 부착 검토
      - 내용물 확인 불가 시 사용 중지 및 담당자 확인
  CHEM_LEAK_SUSPECTED:
    name: 화학물질 누출·유출(의심 포함)
    category: 화학물질
    rules:
      - ["(드럼|약품|폐액|도금|배관|액체|약품인지|용기)", "(흘러|새|떨어지|누출|유출|흘러내린|젖어)"]
    actions:
      - 접근 통제 후 누출 여부 및 물질 확인
      - 흡착재 비치 및 누출 대응 절차 확인 검토
  CHEM_CONTAINER_OPEN:
    name: 화학물질 용기 뚜껑 개방
    category: 화학물질
    rules:
      - ["(통|캔|용기|말통)", "(뚜껑|마개)", "(열린|열려|안 닫)"]
    actions:
      - 사용하지 않는 용기 밀폐
      - 사용 후 밀폐 절차 안내 검토
  MACH_GUARD_ISSUE:
    name: 회전체 방호덮개 탈락·파손
    category: 기계
    rules:
      - ["(덮개|커버|방호)", "(떼어|빠져|빠진|없|덜렁|탈락|파손)"]
    actions:
      - 설비 정지 후 방호덮개 재설치 검토
      - 방호장치 미설치 상태 운전 금지 표시
  MACH_ESTOP_ISSUE:
    name: 비상정지장치 이상
    category: 기계
    rules:
      - ["비상정지", "(안 멈|안 들어|깨져|끊어|반응이 늦|이상|작동 안)"]
    actions:
      - 비상정지장치 점검 전까지 설비 사용 제한 검토
      - 비상정지장치 수리 및 작동 시험
  MACH_ABNORMAL_NOISE:
    name: 설비 이상 소음·진동
    category: 기계
    rules:
      - ["(소리|소음|진동|덜덜)", "(끼익|긁|심하|평소|이상|다른|나는데|들립|납니다|나요)"]
    actions:
      - 설비 담당자에게 이상 소음·진동 점검 요청
      - 점검 결과에 따라 가동 중지 여부 판단
  VENT_LEV_MALFUNCTION:
    name: 국소배기장치 작동 불량(의심 포함)
    category: 환기
    rules:
      - ["(배기|후드|덕트|흡입)", "(약|안 하|멈|구멍|꺼져|안 빨)"]
    actions:
      - 국소배기장치 작동 상태(풍량) 점검 요청
      - 점검 전 해당 작업 시 호흡보호구 착용 여부 확인
  GAS_CYLINDER_UNSECURED:
    name: 가스용기 전도 방지 고정 미흡
    category: 가스
    rules:
      - ["용기", "(체인 없이|고정 없이|고정대 없이|묶여 있지 않|기울어)"]
    actions:
      - 가스용기 체인·고정대로 고정
      - 용기 보관 위치 지정 검토
  GAS_CYLINDER_STORAGE:
    name: 가스용기 보관상태 부적정
    category: 가스
    rules:
      - ["용기", "(햇빛|직사광선|칸막이 없이|붙어서|캡이 안|캡도 없|캡 없)"]
    actions:
      - 보호캡 체결 및 직사광선·열원 회피 보관 검토
      - 가연성·조연성 가스 분리 보관 검토
  GAS_LEAK_SUSPECTED:
    name: 가스 누출 의심
    category: 가스
    rules:
      - ["(가스|누출|레귤레이터|밸브)", "(냄새|거품|쉬익)"]
    actions:
      - 화기 사용 중지 및 환기, 가스 담당자 확인 요청
      - 누출 확인 시 밸브 차단 절차 검토
  FIRE_EXTINGUISHER_ISSUE:
    name: 소화기 접근 방해·미비치·상태 이상
    category: 화재
    rules:
      - ["소화기", "(앞|꺼낼 수|없|안 보|빨간|비어|쌓)"]
    actions:
      - 소화기 전면 적치물 제거 및 비치 위치 확인
      - 소화기 교체·충전 상태 점검 검토
  FIRE_FLAMMABLE_NEAR_IGNITION:
    name: 인화성 물질의 화기·열원 인접
    category: 화재
    rules:
      - ["(시너|휘발유|기름 걸레|폐유|걸레|인화)", "(용접|그라인더|불티|보일러|옆|바로)"]
    actions:
      - 인화성 물질을 화기·열원에서 이격 보관
      - 화기작업 전 주변 인화물 제거 확인 검토
  FALL_OPENING_UNGUARDED:
    name: 개구부·가장자리 난간 미설치
    category: 추락
    rules:
      - ["(난간|개구부|피트|채광창|안전망|펜스)", "(빠져|없|열어|미설치)"]
    actions:
      - 개구부 주변 접근 통제 및 임시 난간·덮개 설치 검토
      - 난간 복구 일정 확인
  FALL_LADDER_UNSTABLE:
    name: 사다리·이동식 비계 불안정
    category: 추락
    rules:
      - ["(사다리|비계)", "(흔들|밀립|휘어|기우뚱|짧아|빠져|안 걸려)"]
    actions:
      - 해당 사다리·비계 사용 중지 및 교체 검토
      - 사용 전 점검 절차 확인
  PPE_NOT_WORN:
    name: 보호구 미착용
    category: 보호구
    rules:
      - ["(보안경|마스크|귀마개|안전모|용접면|보호구)", "(없이|안 쓰|안 하|안 했|미착용|안 썼)"]
    actions:
      - 작업 전 보호구 지급·착용 확인
      - 보호구 착용 기준 안내 검토
  NONE:
    name: 위험요인 없음(정상 보고)
    category: 정상
    rules: []
    actions: []
  UNKNOWN_NEEDS_CHECK:
    name: 위험요인 특정 불가(확인 필요)
    category: 확인필요
    rules: []
    actions:
      - 신고자에게 위치·대상·상황 추가 확인
      - 안전관리자 현장 확인 검토
