# Safety Inspection Assistant 설정 파일
# 코드에 고정하지 않을 값(경로, 모델, 임계값, 판정 기준)을 모두 여기에 둡니다.

paths:
  taxonomy: config/taxonomy.yaml
  cases: data/cases.jsonl          # 모델 입력(정답 없음)
  gold: data/gold.jsonl            # 사전 정답(모델 실행 전 고정)
  gold_lock: data/GOLD_LOCK.json   # 정답 파일 SHA-256 고정 기록
  prompts_dir: prompts
  runs_dir: runs                   # 실험 결과(실행마다 새 폴더, 덮어쓰지 않음)
  records_dir: records             # UI 신고 기록(사건별 폴더)
  audio_dir: data/audio            # STT 시험용 오디오

llm:
  default_backend: ollama          # rule | ollama | anthropic
  prompt_file: system_v1.md
  backends:
    ollama:
      # 로컬 실행: 입력 텍스트가 이 PC 밖으로 나가지 않습니다.
      # 127.0.0.1 사용: 이 PC 에서 'localhost' 는 IPv6(::1) 시도 후 넘어가느라 요청마다 약 2.04초가 더 걸렸습니다(2026-11-17 측정).
      base_url: http://127.0.0.1:11434
      model: qwen3.5:4b
      execution_location: 로컬 PC (Ollama, GPU/CPU)
      data_transfer: 없음 (localhost)
      license: Apache-2.0 (ollama show --license 로 확인)
      temperature: 0
      think: false
      # 2026-11-17 진단: 프롬프트 약 1,040 토큰 + 출력 약 200~250 토큰 → 4096 이면 충분(KV 캐시 VRAM 절약).
      # 이전 평가 실행(runs/20261117-142651_ollama)은 8192 로 실행됐으며 그 설정은 실행 폴더에 보존돼 있습니다.
      num_ctx: 4096
      num_predict: 1024             # 출력 토큰 상한(반복 생성 폭주 방지). 정상 출력은 약 200~300 토큰
      keep_alive: 30m               # 모델을 GPU 에 유지해 매 요청마다 다시 불러오지 않음(냉시작 약 15초)
      # 스트리밍으로 받으며 "멈춤"을 감지합니다. 제한 시간을 늘리는 대신 진행이 없으면 빨리 실패시키고
      # 규칙 기반/수동 작성으로 넘어갈 수 있게 합니다.
      connect_timeout_sec: 5
      first_token_timeout_sec: 60   # 모델 로딩(냉시작) + 프롬프트 처리까지 허용 시간
      stall_timeout_sec: 20         # 토큰 사이에 이 시간 동안 아무것도 오지 않으면 멈춤으로 판단
      max_total_sec: 90             # 전체 상한(정상 측정치: 냉시작 약 26초, 예열 후 약 12초)
    anthropic:
      # 외부 API: 입력 텍스트가 Anthropic 서버로 전송됩니다. API 키는 환경변수로만 받습니다.
      base_url: https://api.anthropic.com/v1/messages
      model: claude-haiku-5-5
      api_key_env: ANTHROPIC_API_KEY
      execution_location: 외부 클라우드 API (Anthropic)
      data_transfer: 신고 원문·장소가 외부로 전송됨
      license: Anthropic 상용 이용약관 (API)
      temperature: 0
      max_tokens: 2000
      timeout_sec: 120

rule:
  # 문장(또는 절)에 아래 표현이 있으면 그 문장/절의 위험 키워드를 부정된 것으로 봅니다.
  negation_markers: ["정상", "이상 없", "문제 없", "특이사항 없", "비어 있", "닫혀 있", "고정돼 있", "씌워져 있", "장착돼 있", "잘 되", "지는 않", "지 않습니다", "못 봤"]
  # 위험요인이 없고 아래 표현이 있으면 정상 보고로 봅니다.
  normal_markers: ["특이사항 없", "이상 없", "이상없", "문제 없", "발견되지 않", "정상", "위험은 못 봤"]
  # 아래 표현이 있으면 정보 부족(확인 필요)으로 봅니다.
  uncertainty_markers: ["모르겠", "것 같기도", "인지", "확인 부탁", "확인 필요", "애매", "같기도", "이상한 느낌", "뭔가", "뭐가"]

analysis:
  # 텍스트가 이 길이(공백 제외)보다 짧으면 위험요인을 추측하지 않고 확인 필요로 처리합니다.
  min_text_chars: 2
  # 원문에 없는데 출력에 등장하면 "사실 추가 의심"으로 표시하는 표현(자동 휴리스틱, 사람 검토 필요)
  fabrication_terms: ["부상", "다쳤", "다침", "다친", "사고가 발생", "사고 발생", "재해", "위반", "법령", "법 ", "산업안전보건법", "과태료", "벌금", "사망", "화상", "골절", "중독", "폭발했", "화재가 발생"]
  # 근거 인용(evidence)이 원문에 있는지 볼 때 무시할 문자
  evidence_ignore_chars: " \t\n.,!?\"'·…"

stt:
  engine: faster-whisper
  model_size: small               # tiny | base | small | medium (클수록 정확하지만 느리고 무거움)
  language: ko
  device: auto                    # auto | cuda | cpu (auto: cuda 실패 시 cpu)
  compute_type_cuda: float16
  compute_type_cpu: int8
  beam_size: 5
  # 화면에서는 STT를 별도 프로세스로 실행하고, 이 시간 안에 끝나지 않으면 종료 후 텍스트 입력으로 안내합니다.
  # (네이티브 라이브러리가 멈추면 같은 프로세스 안에서는 중단할 수 없기 때문)
  # 실제 제한 = max(min_timeout_sec, 오디오 길이 × timeout_per_audio_sec)
  min_timeout_sec: 60
  timeout_per_audio_sec: 4

report:
  disclaimer: >-
    본 신고서는 교육용 PoC가 생성한 최초 위험요인 신고서 초안입니다. 위험유형·위험요인·개선조치는 검토용 후보이며,
    법적 적합성 판정이 아닙니다. 최종 판단은 안전관리자가 합니다. 첨부 사진은 AI가 분석하지 않았습니다.
